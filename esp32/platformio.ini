; ============================================================
; ESP32-CAM AI-Thinker — projekt "Holub"
; ============================================================

[env:esp32cam]
platform              = espressif32 @ 6.7.0   ; pin: stabilní s ESP32 Arduino core 2.0.x
board                 = esp32cam
framework             = arduino

; Velký app slot — kamera + ESPAsyncWebServer + ArduinoJson se nevejdou
; do defaultního 1.25MB partition. Žádné OTA (zatím).
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed  = 115200


; ESPAsyncWebServer: udržovaný fork od mathieucarbou (původní me-no-dev má známé race-conditiony).
; AsyncTCP se stáhne jako tranzitivní závislost.
lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.3.18
    bblanchon/ArduinoJson@^7.0.4
    madhephaestus/ESP32Servo@^3.0.5
